aid: uniko
name: Uniko
description: Uniko is a Mexican gift registry (mesa de regalos) SaaS platform for weddings,
  events, and baby showers, letting couples convert gifts into cash deposited directly
  to their bank account. The platform bundles a personalized wedding website, save-the-date
  digital invitations, WhatsApp-based guest confirmation, and planning tools, and also
  offers store-credit gift registries for ecommerce shops. Uniko is a 500 Global portfolio
  company; it is consumer-facing and publishes no public API or developer documentation.
